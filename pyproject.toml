[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aionflow"
version = "0.1.0"
description = "Companion code for the AION X-ray paper: the eROSITA x DESI x Legacy Survey data pipeline, and the read-only CLS probe with normalizing-flow heads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "astropy>=6.1",
    "h5py>=3.11",
    "fsspec>=2024.6",
    "aiohttp>=3.9",
    "pyyaml>=6",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
model = [
    "torch>=2.4",
    "zuko>=1.6",
    "polymathic-aion>=0.0.2",
    "safetensors>=0.4",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aionflow_data*", "aionflow_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
